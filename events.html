<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/assets/img/brand.png" />
    <script>
      // apply the saved site theme (see src/theme/theme.js) before anything draws
      try { if (localStorage.getItem('lrm.theme') === 'style-guide') document.documentElement.dataset.theme = 'style-guide' } catch (e) {}
    </script>
    <title>Events · LittleRedMusic</title>
  </head>
  <body>
    <!-- The Events section (/events/*) is a Vue app; every other page is React (index.html). -->
    <div id="app"></div>
    <script type="module" src="/src/events.js"></script>
  </body>
</html>
